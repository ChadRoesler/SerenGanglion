name: Build & Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Test py${{ matrix.python-version }} [${{ matrix.extras }}]"
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the module's own Python (Ubuntu 22.04): it must always pass there.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # test first: the leanest shape, Sinew and pytest only, as close to the
        # module as a runner gets. dev adds pyzmq for the socket tests.
        extras: ["test", "dev"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and deps (extras = ${{ matrix.extras }})
        run: pip install -e ".[${{ matrix.extras }}]"
        working-directory: SerenGanglion
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: SerenGanglion

  build-and-release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        working-directory: SerenGanglion

      - name: Upload dist as artifact (handed to the publish job)
        uses: actions/upload-artifact@v4
        with:
          name: seren-ganglion-dist
          path: SerenGanglion/dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SerenGanglion/dist/*

  pypi-publish:
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seren-ganglion
    permissions:
      id-token: write   # MANDATORY for Trusted Publishing; job-level = least privilege
    steps:
      - name: Download the built dist
        uses: actions/download-artifact@v4
        with:
          name: seren-ganglion-dist
          path: dist/

      - name: Publish to PyPI (tokenless)
        uses: pypa/gh-action-pypi-publish@release/v1
